<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-admin-form">
    <div class="admin-form">
        <div class="security-ui-div">
        <h1 class="admin-login-text">Admin Login</h1>
        <div class="icon-circle">
<i class="fa-solid fa-shield" id="security-icon"></i>
</div>
        </div>
        <h5 class="ee">Enter Your E-mail</h5>
        <input type="email" id="admin-email" class="admin-txt" placeholder="E-mail">
        <h5 class="ee">Enter Your Password</h5>
        <input type="email" id="admin-password" class="admin-txt" placeholder="Password">
     <button type="button" class="admin-login-btn" id="admin-btn">
  LOGIN
</button>
    </div>
    </div>  

    <script src="admin-login.js" type="module"></script>

</body>
</html>
